<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Quiz Game</h1>

        <div id="quiz-box">
            <h2 id="question">Question will appear here</h2>

            <div id="answer-buttons">
                <button class="answer-btn">Option 1</button>
                <button class="answer-btn">Option 2</button>
                <button class="answer-btn">Option 3</button>
                <button class="answer-btn">Option 4</button>
            </div>

            <button id="next-btn">Next</button>
        </div>

        <div id="result-box" class="hide">
            <h2>Quiz Completed! 🎉</h2>
            <p id="score">Your Score: 0/10</p>
            <button id="restart-btn">Restart Quiz</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
